name: Release

# Every push to main builds Akko.dmg (macOS) and Akko-Setup.exe (Windows) to check they still build.
# Push a tag like v0.2.0 and the same builds are attached to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Build Akko.app and dmg
        run: |
          xcodebuild -version
          cd core && npm ci && cd ..
          cd mac
          # Show compiler errors as annotations on the run page.
          ./build.sh 2>&1 | tee build.log || { grep -E "error:" build.log | head -20 | sed 's/^/::error::/'; exit 1; }
          cp build/Akko-*.dmg ../Akko.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: Akko.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: win
      - name: Build Akko.exe (Rust + WebView2)
        shell: bash
        run: |
          cd core && npm ci && npm run build && cd ..
          cargo build --release --manifest-path win/Cargo.toml
          ls -la win/target/release/akko.exe
      - name: Build the installer
        shell: pwsh
        run: |
          $v = (Get-Content core/package.json | ConvertFrom-Json).version
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile win/installer/MicrosoftEdgeWebview2Setup.exe
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$v" win/installer/akko.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item win/target/installer/Akko-Setup.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: win/target/installer/Akko-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Akko.dmg
            Akko-Setup.exe
          body: |
            ## Download

            | | |
            |---|---|
            | 🍎 **macOS 13+** (Apple Silicon & Intel) | **Akko.dmg** — open it and drag Akko into Applications |
            | 🪟 **Windows 10/11** | **Akko-Setup.exe** — run it, Akko installs and starts by himself |

            **First launch on macOS:** the app isn't notarized yet, so macOS asks first. Right-click Akko → *Open*, or go to System Settings → Privacy & Security → *Open Anyway*.
            **First launch on Windows:** if SmartScreen appears, click *More info* → *Run anyway*.
