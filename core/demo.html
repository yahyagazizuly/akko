<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akko demo</title>
  <style>
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #faf8f2; color: #151513; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 20px 220px; }
    .card { border: 2px solid #151513; border-radius: 14px; padding: 16px 20px; margin: 28px 0; background: #fff; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    button { font: inherit; padding: 6px 12px; border: 2px solid #151513; border-radius: 10px; background: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Akko</h1>
    <p>He lives at the bottom of the screen. Poke him, grab him, throw him.</p>
    <div class="card" data-chelik>
      <div class="row">
        <button id="pause">Pause / resume</button>
        <button id="hide">Hide / show</button>
        <button id="lite">Low power</button>
        <button id="feed">Throw food 🍪</button>
        <select id="act"></select>
      </div>
    </div>
    <h2>He can jump onto this heading</h2>
    <div class="card" data-chelik>And sit on this card, tug it or slap a sticker on it.</div>
  </main>
  <script type="module">
    import { createAkko as createChelik } from "./dist/akko.js";
    const c = createChelik({ size: 48 });
    window.chelik = c;
    let lite = false;
    document.getElementById("pause").onclick = () => c.toggle();
    document.getElementById("hide").onclick = () => (c.visible ? c.hide() : c.show());
    document.getElementById("feed").onclick = () => c.feed();
    document.getElementById("lite").onclick = () => c.set({ lowPower: (lite = !lite) });
    const sel = document.getElementById("act");
    sel.innerHTML = `<option value="">Do a trick…</option>` + c.play().map((n) => `<option>${n}</option>`).join("");
    sel.onchange = () => { if (sel.value) c.play(sel.value); sel.value = ""; };
  </script>
</body>
</html>
